# Shell
shell_integration no-rc no-sudo
shell /bin/bash -il

# Font
font_size        14.0
font_family      JetBrainsMono NF Regular
bold_font        JetBrainsMono NF Bold
italic_font      JetBrainsMono NF Italic
bold_italic_font JetBrainsMono NF Bold Italic

# Cursor
cursor                #4E4E4E
cursor_text_color     background
cursor_shape          block
cursor_blink_interval 0

# No bells
bell_on_tab          no
enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell no

# Window layout
placement_strategy center

# OS specific configuration file (symlink at the same directory level)
include kitty.os.conf

# Color theme
include themes/${SYSTEM_THEME}.conf
